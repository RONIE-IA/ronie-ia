<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ronie IA | Links</title>
    <style>
        /* Fundo azul profundo para passar confiança e segurança */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0b192c; 
            color: #ffffff;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        /* Estilo do Logo/Avatar redondo */
        .profile-pic {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background-color: #ffffff;
            margin-bottom: 16px;
            object-fit: cover;
            border: 3px solid #3a86ff;
        }
        .title {
            font-size: 22px;
            font-weight: bold;
            margin: 0 0 8px 0;
            text-align: center;
        }
        /* Chamada para Ação (CTA) direta */
        .description {
            font-size: 16px;
            color: #8da2b5;
            margin: 0 0 32px 0;
            text-align: center;
            font-weight: 500;
        }
        .link-container {
            width: 100%;
            max-width: 600px; /* Largura ideal para celular */
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        /* Estilo do botão único */
        .link-btn {
            display: block;
            width: 100%;
            background-color: #ffffff;
            color: #0b192c;
            padding: 16px 20px;
            text-align: center;
            text-decoration: none;
            border-radius: 30px;
            font-size: 16px;
            font-weight: bold;
            box-sizing: border-box;
            transition: transform 0.2s, box-shadow 0.2s;
            border: 2px solid transparent;
        }
        /* Efeito ao passar o mouse */
        .link-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 4px 15px rgba(58, 134, 255, 0.4);
            border-color: #3a86ff;
        }
    </style>
</head>
<body>
    <!-- Imagem provisória (coloque seu logotipo aqui) -->
    <img src="logo.png.jpeg" alt="Sua Foto" class="profile-pic">

    <h1 class="title">Ronie IA</h1>
    
    <!-- O Básico: Chamada para Ação -->
    <p class="description">Acesse meus vídeos e materiais abaixo 👇</p>

    <!-- Único Botão -->
    <div class="link-container">
        <a href="https://www.youtube.com/@ronie-ia" class="link-btn" target="_blank">YOU TUBE</a>
    </div>
</body>
</html>
